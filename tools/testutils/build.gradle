plugins {
	id 'java-library'
	id 'java-test-fixtures'
	id 'maven-publish'
}

description = 'openmdm test utils'

dependencies {
	testFixturesApi  "org.testcontainers:testcontainers:1.21.0"
	
	testFixturesApi  'com.fasterxml.jackson.datatype:jackson-datatype-jsr310:2.19.0'
	testFixturesApi  'org.glassfish.main.extras:glassfish-embedded-all:7.0.24'
	testFixturesApi  'org.glassfish.jersey.connectors:jersey-apache-connector:3.1.10'
	testFixturesApi  'org.postgresql:postgresql:42.7.5'
	testFixturesApi  'org.slf4j:jul-to-slf4j:2.0.17'
	testFixturesApi  'org.apache.logging.log4j:log4j-to-slf4j:2.24.3'

	//testFixturesImplementation(platform('org.junit:junit-bom:5.12.2'))
	testFixturesImplementation('org.junit.jupiter:junit-jupiter:5.12.2')
	testFixturesImplementation("junit:junit:4.13.2")
}

publishing {
	publications {
		mavenJava(MavenPublication) {
			suppressPomMetadataWarningsFor("testFixturesApiElements")
			suppressPomMetadataWarningsFor("testFixturesRuntimeElements")
			artifactId = 'testutils'
			from components.java
		}
	}
	repositories {
		mavenLocal()
	}
}